name: Metrics
on:
  # Schedule updates (every 12 hours) at 00:00 UTC (05:30 IST) to update the metrics - 0 */12 * * *
  # Scedules every Sunday at 00:00 UTC (05:30 IST) to update the metrics - 0 0 * * 0
  # Schedules every 1st of the month at 00:00 UTC (05:30 IST) to update the metrics - 0 0 1 * *
  # Schedules every day at 18:00 UTC (23:30 IST) to update the metrics - 0 18 * * *
  schedule: [{ cron: "0 0 1 * *" }]
  # Lines below let you run workflow manually and on each commit
  workflow_dispatch:
  push: { branches: ["master", "main"] }
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: pranavkapale
          template: classic
          base: header, community, repositories, metadata
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_lines: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          config_order: base.header, isocalendar, languages, base.repositories, habits
